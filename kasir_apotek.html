<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Apotek</title>
<style>
:root{
  --p:#9d1e42; --p2:#7f1124; --pd:#3a1108; --bg:#f9f0f2; --card:#fff; --tx:#2b1a1c; --mut:#84676e;
  --red:#e5484d; --org:#f5a524; --grn:#2fb872; --line:#f0dfe4; --r:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
button{font-family:inherit;cursor:pointer}
/* Sidebar */
aside{width:230px;background:linear-gradient(170deg,#2c1003,#591112 45%,#a62c4e);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 22px;font-weight:700;font-size:18px;line-height:1.2}
.brand .logo{width:46px;height:46px;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}.brand .logo svg{width:100%;height:100%;display:block}
.brand small{display:block;font-weight:400;opacity:.75;font-size:11px}
nav button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;color:#f6dfe6;padding:12px 14px;border-radius:10px;font-size:15px;margin-bottom:4px;text-align:left}
nav button:hover{background:rgba(255,255,255,.1)}
nav button.on{background:#fff;color:var(--pd);font-weight:600}
.side-foot{margin-top:12px;font-size:12px;opacity:.75;padding:0 8px}
main{flex:1;padding:26px 30px;min-width:0}
h1{margin:0 0 4px;font-size:24px}
.sub{color:var(--mut);margin-bottom:22px;font-size:14px}
/* Cards */
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 2px 12px rgba(60,15,25,.08)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat{display:flex;gap:14px;align-items:center}
.stat .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:24px}
.stat b{font-size:22px;display:block}
.stat span{color:var(--mut);font-size:13px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.card h3{margin:0 0 12px;font-size:16px}
/* Table */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:10px 8px;border-bottom:2px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fcf5f7}
.tw{overflow-x:auto}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.b-g{background:#dff6ea;color:#1b7a4a}.b-r{background:#fde3e4;color:#b3262b}.b-o{background:#fdf0d4;color:#9a6100}.b-b{background:#e0eefc;color:#1d5fa8}
/* Inputs & buttons */
input,select{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;width:100%}
input:focus,select:focus{outline:0;border-color:var(--p)}
label{font-size:13px;font-weight:600;color:var(--mut);display:block;margin-bottom:5px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;background:var(--p);color:#fff}
.btn:hover{background:var(--p2)}
.btn.sec{background:#f6e4e9;color:var(--pd)}.btn.sec:hover{background:#edd0da}
.btn.red{background:var(--red)}.btn.sm{padding:6px 10px;font-size:12px}
.btn.big{width:100%;padding:14px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{width:auto;flex:1;min-width:160px}
/* Kasir */
.pos{display:grid;grid-template-columns:1fr 390px;gap:18px;align-items:start}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;max-height:calc(100vh - 210px);overflow:auto;padding:2px}
.prod{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:left;transition:.15s}
.prod:hover:not(:disabled){border-color:var(--p);transform:translateY(-2px);box-shadow:0 6px 16px rgba(157,30,66,.20)}
.prod:disabled{opacity:.45;cursor:not-allowed}
.prod .n{font-weight:600;font-size:14px;margin:6px 0 2px}
.prod .k{font-size:11px;color:var(--mut)}
.prod .h{color:var(--p2);font-weight:700;margin-top:6px}
.prod .s{font-size:11px;color:var(--mut)}
.cart{position:sticky;top:20px}
.items{max-height:300px;overflow:auto;margin-bottom:10px}
.it{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.it .nm{flex:1;font-size:14px}.it .nm small{color:var(--mut);display:block}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;border-radius:8px;border:0;background:#f6e4e9;font-weight:700}
.row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.row.t{font-size:20px;font-weight:700;color:var(--p2);border-top:2px solid var(--line);margin-top:6px;padding-top:10px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.quick button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px}
.quick button:hover{border-color:var(--p)}
.empty{text-align:center;color:var(--mut);padding:30px 0;font-size:14px}
/* Chart */
.chart{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}
.chart div.c{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart .b{background:linear-gradient(180deg,var(--p),#dc94ab);border-radius:8px 8px 0 0;min-height:3px}
/* Modal */
#ov{position:fixed;inset:0;background:rgba(44,16,3,.55);display:none;place-items:center;z-index:50;padding:16px}
#ov.on{display:grid}
#ov.putih{background:#fff;overflow:auto}
#ov.putih #md{box-shadow:none;max-width:460px}
#md{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
#md h3{margin:0 0 14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.fg .full{grid-column:1/-1}
.acts{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;bottom:24px;right:24px;background:var(--pd);color:#fff;padding:12px 20px;border-radius:12px;display:none;z-index:300;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.err{background:var(--red)}
/* Struk */
.struk{font-family:"Courier New",monospace;font-size:13px;width:100%;max-width:300px;margin:0 auto}
.struk .c{text-align:center}.struk hr{border:0;border-top:1px dashed #333;margin:8px 0}
.struk .r{display:flex;justify-content:space-between}
.struk .qrs{width:104px;margin:8px auto 2px}
/* QRIS */
textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:12px;font-family:"Courier New",monospace;width:100%;resize:vertical;min-height:84px}
textarea:focus{outline:0;border-color:var(--p)}
.qrsvg{width:100%;height:auto;display:block}
.qrbox{margin:12px 0 4px;border:2px solid #d3161c;border-radius:14px;overflow:hidden;text-align:center;background:#fff}
.qrhead{background:#d3161c;color:#fff;padding:8px 10px;display:flex;justify-content:space-between;align-items:center}
.qrhead b{font-size:20px;letter-spacing:2px;font-style:italic}
.qrhead span{font-size:10px;opacity:.9;text-align:right}
.qrimg{width:210px;margin:12px auto 6px;padding:6px;border:1px solid var(--line);border-radius:8px}
.qrnm{font-weight:700;font-size:13px;text-transform:uppercase}
.qramt{font-size:22px;font-weight:800;color:#d3161c;margin:2px 0 6px}
.qrnote{font-size:11px;padding:6px 10px 10px;color:var(--mut)}
.qrdemo{font-size:11px;padding:6px 10px;background:#fdf0d4;color:#8a5a00;font-weight:600}
.qrerr{padding:16px;color:var(--red);font-size:13px}
/* Login */
#login{position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:16px;background:linear-gradient(135deg,var(--pd),var(--p2) 55%,var(--p))}
#login.on{display:grid}
.lbox{background:#fff;border-radius:18px;padding:30px 28px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.lbox .lg{width:84px;height:84px;margin:-4px auto 8px;filter:drop-shadow(0 6px 10px rgba(127,17,36,.35))}.lbox .lg svg{width:100%;height:100%;display:block}
.lbox h2{margin:0;text-align:center;font-size:22px}
.lbox .ls{text-align:center;color:var(--mut);font-size:13px;margin:4px 0 20px}
.lbox .lf{margin-bottom:14px}
.lbox .pw{position:relative}
.lbox .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:16px;padding:6px}
.lbox .lerr{background:#fde3e4;color:#b3262b;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px;display:none}
.lbox .lhint{margin-top:16px;font-size:12px;color:var(--mut);text-align:center;background:#fbf1f4;border-radius:10px;padding:8px 10px}
.side-user{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.2);font-size:13px}
.side-user b{display:block;margin-bottom:8px}
.side-user .ub{display:flex;gap:6px}
.side-user button{flex:1;border:0;border-radius:8px;padding:8px 6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.15);color:#fff}
.side-user button:hover{background:rgba(255,255,255,.28)}
@media(max-width:1000px){.pos{grid-template-columns:1fr}.cart{position:static}}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static;padding:12px}nav{display:flex;overflow:auto;gap:4px}nav button{white-space:nowrap;width:auto}.side-foot{display:none}.brand{padding-bottom:10px}main{padding:16px}.side-user{margin-top:10px}}
@media print{body *{visibility:hidden}#strukArea,#strukArea *{visibility:visible}#strukArea{position:absolute;left:0;top:0;width:80mm}#login{display:none!important}}
</style>
</head>

</aside>

<main id="main"></main>

<div id="ov"><div id="md"></div></div>
<div id="toast"></div>

<!-- Halaman Login -->
<div id="login">
  <div class="lbox" id="lform">
    <div class="lg"><svg viewBox="0 0 64 64"><use href="#logoApotek"/></svg></div>
    <h2 id="lNama">Apotek</h2>
    <div class="ls">Silakan masuk untuk menggunakan sistem kasir</div>
    <div class="lerr" id="lerr"></div>
    <div class="lf"><label for="lu">Username</label><input id="lu" type="text" autocomplete="username" placeholder="Masukkan username"></div>

      <div class="pw"><input id="lp" type="password" autocomplete="current-password" placeholder="Masukkan password"><button type="button" id="lshow" title="Tampilkan/sembunyikan">👁️</button></div>
    </div>
    <button class="btn big" type="button" id="lbtn">Masuk</button>
  </div>
</div>

function addCart(id) {
  var o = findObat(id), c = cart.filter(function (x) { return x.id === id; })[0];
  var cur = c ? c.qty : 0;
  if (cur + 1 > o.stok) { toast("Stok " + o.nama + " tidak cukup", true); return; }
  if (c) c.qty++; else cart.push({ id: id, qty: 1 });
  drawCart();
}
function chQty(id, d) {
  var c = cart.filter(function (x) { return x.id === id; })[0], o = findObat(id);
  if (!c) return;
  if (d > 0 && c.qty + 1 > o.stok) { toast("Stok tidak cukup", true); return; }
  c.qty += d;
  if (c.qty <= 0) cart = cart.filter(function (x) { return x.id !== id; });
  drawCart();
}
function delCart(id) { cart = cart.filter(function (x) { return x.id !== id; }); drawCart(); }
function clearCart() { cart = []; drawCart(); }

var pay = { diskon: 0, metode: "Tunai", uang: "" };
/* Promo otomatis pada hari yang dipilih di bawah, per obat: harga < Rp10.000 diskon 3%, harga >= Rp10.000 diskon 5%
   (hari: 0=Minggu, 1=Senin, 2=Selasa, ...) */
var PROMO = { hari: 2, batas: 10000, rendah: 3, tinggi: 5 };
function namaHari() { return ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"][PROMO.hari]; }
function isPromo() { return new Date().getDay() === PROMO.hari; }
function promoPersen(harga) {
  if (!isPromo()) return 0;
  if (harga > 150000) return 15;
  if (harga > 80000) return 9;
  if (harga > 30000) return 7;
  if (harga >= PROMO.batas) return PROMO.tinggi; // Rp10.000 - 30.000 = 5%
  return PROMO.rendah;                           // di bawah Rp10.000 = 3%
}
function promoUnit(harga) { return Math.round(harga * promoPersen(harga) / 100); }
function hitung() {
  var sub = 0, promo = 0;
  cart.forEach(function (c) {
    var o = findObat(c.id);
    sub += o.harga * c.qty;
    promo += promoUnit(o.harga) * c.qty;
  });
  var dk = Math.min(100, Math.max(0, parseFloat(pay.diskon) || 0));
  var potong = (sub - promo) * dk / 100;
  return { sub: sub, pr: isPromo(), promo: promo, dk: dk, potong: potong, total: sub - promo - potong };
}

function drawCart() {
  if (page !== "kasir") return;
  $("items").innerHTML = cart.length ? cart.map(function (c) {
    var o = findObat(c.id);
    return '<div class="it"><div class="nm">' + esc(o.nama) + '<small>' + (promoUnit(o.harga) ? '<s>' + rp(o.harga) + '</s> ' + rp(o.harga - promoUnit(o.harga)) + ' <span class="badge" style="background:#f6e1e7;color:var(--p2);padding:1px 7px;font-size:11px">-' + promoPersen(o.harga) + '%</span>' : rp(o.harga)) + ' × ' + c.qty + ' = <b>' + rp((o.harga - promoUnit(o.harga)) * c.qty) + '</b></small></div>' +
      '<div class="qty"><button onclick="chQty(' + c.id + ',-1)">−</button><b>' + c.qty + '</b><button onclick="chQty(' + c.id + ',1)">+</button></div>' +
      '<button class="btn red sm" onclick="delCart(' + c.id + ')">✕</button></div>';
  }).join("") : '<div class="empty">Keranjang masih kosong</div>';

  '<div class="row"><span>Subtotal</span><b>' + rp(h.sub) + '</b></div>' +
    (h.promo ? '<div class="row" style="color:var(--p2)"><span>Diskon ' + namaHari() + ' (per obat)</span><span>− ' + rp(h.promo) + '</span></div>' : "") +
    '<div class="row"><span>Diskon (%)</span><input id="pdk" type="number" min="0" max="100" style="width:90px" value="' + pay.diskon + '"></div>' +
    '<div class="row"><span>Potongan</span><span>− ' + rp(h.potong) + '</span></div>' +
    '<div class="row t"><span>TOTAL</span><span>' + rp(h.total) + '</span></div>' +
    '<label style="margin-top:10px">Metode Pembayaran</label>' +
    '<select id="pmt">' + ["Tunai", "QRIS", "Transfer"].map(function (m) { return "<option" + (pay.metode === m ? " selected" : "") + ">" + m + "</option>"; }).join("") + '</select>' +
    (pay.metode === "Tunai" ?
      '<label style="margin-top:10px">Uang Diterima</label><input id="pup" type="number" min="0" value="' + pay.uang + '" placeholder="0">' +
      '<div class="quick"><button onclick="setUang(' + h.total + ')">Uang pas</button>' + [10000, 20000, 50000, 100000].map(function (n) { return '<button onclick="setUang(' + n + ')">' + n / 1000 + 'rb</button>'; }).join("") + '</div>' +
      '<div class="row"><span>Kembalian</span><b style="color:' + (kembali < 0 ? "var(--red)" : "var(--grn)") + '">' + (kembali < 0 ? "Kurang " + rp(-kembali) : rp(kembali)) + '</b></div>' : "") +
    '<button class="btn big" style="margin-top:12px" ' + (cart.length ? "" : "disabled") + ' onclick="bayar()">✅ Bayar</button>' +

  $("pdk").onchange = function () { pay.diskon = this.value; drawCart(); };
  $("pmt").onchange = function () { pay.metode = this.value; drawCart(); };
  if ($("pup")) $("pup").oninput = function () {
    pay.uang = this.value;

function bayar(ok) {
  var h = hitung();
  if (!cart.length) return;
  var uang = pay.metode === "Tunai" ? (parseFloat(pay.uang) || 0) : h.total;
  if (uang < h.total) { toast("Uang yang diterima kurang", true); return; }
  if (pay.metode === "QRIS" && ok !== true) { showQris(h.total); return; }
  for (var i = 0; i < cart.length; i++) {
    var o = findObat(cart[i].id);
    if (cart[i].qty > o.stok) { toast("Stok " + o.nama + " tidak cukup", true); return; }
  }
  var items = cart.map(function (c) {
    var o = findObat(c.id); o.stok -= c.qty;
    return { id: o.id, kode: o.kode, nama: o.nama, harga: o.harga, qty: c.qty, sub: o.harga * c.qty, promoPersen: promoPersen(o.harga), promo: promoUnit(o.harga) * c.qty };
  });
  DB.d.counter.trx++;
  var no = "TRX-" + isoDate(new Date()).replace(/-/g, "") + "-" + String(DB.d.counter.trx).padStart(4, "0");
  var trx = { no: no, tanggal: new Date().toISOString(), kasir: DB.d.settings.kasir, items: items, subtotal: h.sub, promo: h.promo, promoHari: h.promo ? namaHari() : "", diskonPersen: h.dk, potongan: h.potong, total: h.total, metode: pay.metode, bayar: uang, kembali: uang - h.total };
  DB.d.transaksi.push(trx);
  DB.save();
  cart = []; pay = { diskon: 0, metode: "Tunai", uang: "" };
  rKasir();
  showStruk(trx);
  toast("Transaksi berhasil disimpan");
}

function strukHTML(t) {
  var s = DB.d.settings;
  return '<div id="strukArea"><div class="struk"><div class="c"><b>' + esc(s.nama) + '</b><br>' + esc(s.alamat) + '<br>Telp: ' + esc(s.telp) + '</div><hr>' +
    '<div>No : ' + esc(t.no) + '<br>Tgl: ' + tglJam(t.tanggal) + '<br>Kasir: ' + esc(t.kasir) + '</div><hr>' +
    t.items.map(function (i) { return "<div>" + esc(i.nama) + '</div><div class="r"><span>' + i.qty + " x " + i.harga.toLocaleString("id-ID") + "</span><span>" + i.sub.toLocaleString("id-ID") + "</span></div>" + (i.promo ? '<div class="r"><span>&nbsp; Diskon ' + i.promoPersen + '%</span><span>-' + Math.round(i.promo).toLocaleString("id-ID") + '</span></div>' : ""); }).join("") + '<hr>' +
    '<div class="r"><span>Subtotal</span><span>' + t.subtotal.toLocaleString("id-ID") + '</span></div>' +
    (t.promo ? '<div class="r"><span>Total diskon ' + (t.promoHari || "promo") + '</span><span>-' + Math.round(t.promo).toLocaleString("id-ID") + '</span></div>' : "") +
    (t.potongan ? '<div class="r"><span>Diskon ' + t.diskonPersen + '%</span><span>-' + Math.round(t.potongan).toLocaleString("id-ID") + '</span></div>' : "") +
    '<div class="r"><b>TOTAL</b><b>' + Math.round(t.total).toLocaleString("id-ID") + '</b></div>' +
    '<div class="r"><span>Bayar (' + esc(t.metode) + ')</span><span>' + Math.round(t.bayar).toLocaleString("id-ID") + '</span></div>' +
    '<div class="r"><span>Kembali</span><span>' + Math.round(t.kembali).toLocaleString("id-ID") + '</span></div><hr>' +
    '<div class="c">Terima kasih<br>Semoga lekas sembuh 🙏</div></div></div>';
}
function showStruk(t) {
  openModal('<h3>🧾 Struk Pembayaran</h3>' + strukHTML(t) + '<div class="acts" style="margin-top:16px"><button class="btn sec" onclick="closeModal()">Tutup</button><button class="btn" onclick="window.print()">🖨️ Cetak</button></div>');
  $("ov").className = "on putih";
}

/* ================= DATA OBAT ================= */
var oFilter = "";
function rObat() {
  $("main").innerHTML =
    '<h1>Data Obat</h1><div class="sub">Kelola stok, harga, dan tanggal kedaluwarsa</div>' +
    '<div class="card"><div class="bar"><input id="oq" placeholder="🔍 Cari obat..." value="' + esc(oFilter) + '"><button class="btn" onclick="formObat()">+ Tambah Obat</button></div>' +
    '<div class="tw"><table><thead><tr><th>Kode</th><th>Nama</th><th>Kategori</th><th>Harga</th><th>Stok</th><th>Kedaluwarsa</th><th>Aksi</th></tr></thead><tbody id="otb"></tbody></table></div></div>';
  $("oq").oninput = function () { oFilter = this.value; drawObat(); };
  drawObat();
}
function drawObat() {
  var q = oFilter.toLowerCase();
  var l = DB.d.obat.filter(function (o) { return o.nama.toLowerCase().indexOf(q) > -1 || o.kode.toLowerCase().indexOf(q) > -1 || o.kategori.toLowerCase().indexOf(q) > -1; });
  $("otb").innerHTML = l.length ? l.map(function (o) {
    return "<tr><td>" + esc(o.kode) + "</td><td><b>" + esc(o.nama) + "</b></td><td>" + esc(o.kategori) + "</td><td>" + rp(o.harga) + "/" + esc(o.satuan) + "</td>" +
      '<td><span class="badge ' + (o.stok <= o.minStok ? "b-r" : "b-g") + '">' + o.stok + "</span></td><td>" + expBadge(o.expired) + "</td>" +
      '<td style="white-space:nowrap"><button class="btn sec sm" onclick="restock(' + o.id + ')">+Stok</button> <button class="btn sec sm" onclick="formObat(' + o.id + ')">Edit</button> <button class="btn red sm" onclick="hapusObat(' + o.id + ')">Hapus</button></td></tr>';
  }).join("") : '<tr><td colspan="7" class="empty">Belum ada data obat</td></tr>';
}
function formObat(id) {
  var o = id ? findObat(id) : { kode: "", nama: "", kategori: KATEGORI[0], satuan: "Strip", harga: "", stok: "", minStok: 10, expired: "" };
  openModal('<h3>' + (id ? "Edit" : "Tambah") + ' Obat</h3><div class="fg">' +
    '<div><label>Kode</label><input id="f_kode" value="' + esc(o.kode) + '"></div>' +
    '<div><label>Satuan</label><input id="f_satuan" value="' + esc(o.satuan) + '"></div>' +
    '<div class="full"><label>Nama Obat</label><input id="f_nama" value="' + esc(o.nama) + '"></div>' +
    '<div class="full"><label>Kategori</label><select id="f_kat">' + KATEGORI.map(function (k) { return "<option" + (o.kategori === k ? " selected" : "") + ">" + k + "</option>"; }).join("") + '</select></div>' +
    '<div><label>Harga Jual (Rp)</label><input id="f_harga" type="number" min="0" value="' + o.harga + '"></div>' +
    '<div><label>Stok</label><input id="f_stok" type="number" min="0" value="' + o.stok + '"></div>' +
    '<div><label>Stok Minimum</label><input id="f_min" type="number" min="0" value="' + o.minStok + '"></div>' +
    '<div><label>Tgl Kedaluwarsa</label><input id="f_exp" type="date" value="' + o.expired + '"></div></div>' +
    '<div class="acts"><button class="btn sec" onclick="closeModal()">Batal</button><button class="btn" onclick="simpanObat(' + (id || 0) + ')">Simpan</button></div>');
}
function simpanObat(id) {
  var v = { kode: $("f_kode").value.trim(), nama: $("f_nama").value.trim(), kategori: $("f_kat").value, satuan: $("f_satuan").value.trim() || "Pcs",
    harga: parseFloat($("f_harga").value), stok: parseInt($("f_stok").value), minStok: parseInt($("f_min").value) || 0, expired: $("f_exp").value };
  if (!v.kode || !v.nama) return toast("Kode dan nama wajib diisi", true);
  if (isNaN(v.harga) || v.harga < 0) return toast("Harga tidak valid", true);
  if (isNaN(v.stok) || v.stok < 0) return toast("Stok tidak valid", true);
  if (!v.expired) return toast("Tanggal kedaluwarsa wajib diisi", true);
  var dup = DB.d.obat.filter(function (o) { return o.kode.toLowerCase() === v.kode.toLowerCase() && o.id !== id; })[0];
  if (dup) return toast("Kode sudah dipakai obat lain", true);
  if (id) { var o = findObat(id); for (var k in v) o[k] = v[k]; }
  else { v.id = ++DB.d.counter.obat; DB.d.obat.push(v); }
  DB.save(); closeModal(); drawObat(); toast("Data obat disimpan");
}
function hapusObat(id) {
  var o = findObat(id);
  if (!confirm("Hapus " + o.nama + "?")) return;
  DB.d.obat = DB.d.obat.filter(function (x) { return x.id !== id; });
  cart = cart.filter(function (c) { return c.id !== id; });
  DB.save(); drawObat(); toast("Obat dihapus");
}
function restock(id) {
  var o = findObat(id), n = parseInt(prompt("Tambah stok untuk " + o.nama + " (jumlah):", "10"));
  if (!n || n < 1) return;
  o.stok += n; DB.save(); drawObat(); toast("Stok ditambah " + n);
}

/* ================= RIWAYAT ================= */
var rf = { a: "", b: "" };
function rRiwayat() {
  $("main").innerHTML =
    '<h1>Riwayat Transaksi</h1><div class="sub">Semua penjualan yang pernah tercatat</div>' +
    '<div class="card"><div class="bar"><div style="flex:1;min-width:150px"><label>Dari tanggal</label><input type="date" id="ra" value="' + rf.a + '"></div>' +
    '<div style="flex:1;min-width:150px"><label>Sampai tanggal</label><input type="date" id="rb" value="' + rf.b + '"></div></div>' +
    '<div class="tw"><table><thead><tr><th>No. Transaksi</th><th>Waktu</th><th>Kasir</th><th>Item</th><th>Metode</th><th>Total</th><th></th></tr></thead><tbody id="rtb"></tbody></table></div>' +
    '<div class="row t" id="rtot"></div></div>';
  $("ra").onchange = function () { rf.a = this.value; drawRiw(); };
  $("rb").onchange = function () { rf.b = this.value; drawRiw(); };
  drawRiw();
}
function drawRiw() {
  var l = DB.d.transaksi.filter(function (t) {
    var d = t.tanggal.slice(0, 10);
    return (!rf.a || d >= rf.a) && (!rf.b || d <= rf.b);
  }).reverse();
  $("rtb").innerHTML = l.length ? l.map(function (t) {
    var idx = DB.d.transaksi.indexOf(t);
    return "<tr><td>" + esc(t.no) + "</td><td>" + tglJam(t.tanggal) + "</td><td>" + esc(t.kasir) + "</td><td>" + t.items.reduce(function (a, i) { return a + i.qty; }, 0) + '</td><td><span class="badge b-b">' + esc(t.metode) + "</span></td><td><b>" + rp(t.total) + '</b></td><td><button class="btn sec sm" onclick="showStruk(DB.d.transaksi[' + idx + '])">Lihat</button></td></tr>';
  }).join("") : '<tr><td colspan="7" class="empty">Belum ada transaksi</td></tr>';
  $("rtot").innerHTML = "<span>Total (" + l.length + " transaksi)</span><span>" + rp(l.reduce(function (a, t) { return a + t.total; }, 0)) + "</span>";
}

/* ================= PENGATURAN ================= */
function rSet() {
  var s = DB.d.settings;
  $("main").innerHTML =
    '<h1>Pengaturan</h1><div class="sub">Data apotek dan pengelolaan database</div><div class="two">' +
    '<div class="card"><h3>🏥 Data Apotek</h3><div class="fg">' +
    '<div class="full"><label>Nama Apotek</label><input id="s_nama" value="' + esc(s.nama) + '"></div>' +
    '<div class="full"><label>Alamat</label><input id="s_alamat" value="' + esc(s.alamat) + '"></div>' +
    '<div><label>Telepon</label><input id="s_telp" value="' + esc(s.telp) + '"></div>' +
    '<div><label>Nama Kasir</label><input id="s_kasir" value="' + esc(s.kasir) + '"></div></div>' +
    '<button class="btn" onclick="simpanSet()">Simpan</button></div>' +
    '<div class="card"><h3>💾 Database</h3><p style="font-size:14px;color:var(--mut);margin-top:0">Data tersimpan otomatis di browser komputer ini. Lakukan backup secara berkala agar data aman.</p>' +
    '<div class="bar"><button class="btn" onclick="exportDB()">⬇️ Backup (Unduh)</button>' +
    '<button class="btn sec" onclick="$(\'imp\').click()">⬆️ Restore</button><input type="file" id="imp" accept=".json" style="display:none"></div>' +
    '<button class="btn red" onclick="resetDB()">🗑️ Reset Semua Data</button></div></div>';
  $("imp").onchange = importDB;
}
function simpanSet() {
  var s = DB.d.settings;
  s.nama = $("s_nama").value.trim() || "Apotek"; s.alamat = $("s_alamat").value; s.telp = $("s_telp").value; s.kasir = $("s_kasir").value.trim() || "Kasir";
  DB.save(); $("sbNama").textContent = s.nama; $("lNama").textContent = s.nama; toast("Pengaturan disimpan");
}
function exportDB() {
  var b = new Blob([JSON.stringify(DB.d, null, 2)], { type: "application/json" });
  var a = document.createElement("a"); a.href = URL.createObjectURL(b);
  a.download = "backup-apotek-" + isoDate(new Date()) + ".json"; a.click();
  toast("Backup diunduh");
}
function importDB(e) {
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try {
      var d = JSON.parse(r.result);
      if (!d.obat || !d.transaksi || !d.settings || !d.counter) throw 0;
      if (!confirm("Data saat ini akan diganti dengan file backup. Lanjutkan?")) return;
      DB.d = d; DB.save(); cart = []; $("sbNama").textContent = d.settings.nama; $("lNama").textContent = d.settings.nama; toast("Restore berhasil"); rSet();
    } catch (x) { toast("File backup tidak valid", true); }
  };
  r.readAsText(f);
}
function resetDB() {
  if (!confirm("Semua data obat dan transaksi akan dihapus dan dikembalikan ke data contoh. Lanjutkan?")) return;
  DB.d = seed(); DB.save(); cart = []; $("sbNama").textContent = DB.d.settings.nama; $("lNama").textContent = DB.d.settings.nama; toast("Database direset"); rSet();
}

/* ================= LOGIN / AKSES ================= */
/* Akun disimpan terpisah dari data apotek (key sendiri), sehingga
   Backup/Restore/Reset database tidak mengubah akun login.
   Login awal: admin / admin123 (segera ganti lewat tombol "Password"). */
var AUTH = {
  key: "apotek_auth_v1",
  sess: "apotek_session_v1",
  fails: 0,
  lockUntil: 0,
  hash: function (s) {
    s = "apotek|" + s;
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57, i, ch;
    for (i = 0; i < s.length; i++) {
      ch = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  },
  get: function () {
    var a = null;
    try { a = JSON.parse(localStorage.getItem(this.key)); } catch (e) { a = null; }
    if (!a || !a.user || !a.hash) {
      a = { user: "admin", hash: this.hash("admin123"), default: true };
      try { localStorage.setItem(this.key, JSON.stringify(a)); } catch (e) {}
    }
    return a;
  },
  set: function (a) { localStorage.setItem(this.key, JSON.stringify(a)); },
  isIn: function () { try { return sessionStorage.getItem(this.sess) === this.get().user; } catch (e) { return false; } }
};

function showLogin() {
  $("lNama").textContent = DB.d.settings.nama;
  $("login").className = "on";
  $("lerr").style.display = "none";
  $("lu").value = ""; $("lp").value = ""; $("lp").type = "password";
  setTimeout(function () { $("lu").focus(); }, 50);
}
function loginErr(m) { var e = $("lerr"); e.textContent = m; e.style.display = "block"; }

$("lshow").onclick = function () { $("lp").type = $("lp").type === "password" ? "text" : "password"; };
function doLogin() {
  var now = Date.now();
  if (now < AUTH.lockUntil) { loginErr("Terlalu banyak percobaan. Coba lagi dalam " + Math.ceil((AUTH.lockUntil - now) / 1000) + " detik."); return; }
  var a = AUTH.get(), u = $("lu").value.trim(), p = $("lp").value;
  if (u.toLowerCase() === a.user.toLowerCase() && AUTH.hash(p) === a.hash) {
    AUTH.fails = 0;
    try { sessionStorage.setItem(AUTH.sess, a.user); } catch (e) {}
    $("login").className = "";
    startApp();
  } else {
    AUTH.fails++;
    if (AUTH.fails >= 5) { AUTH.fails = 0; AUTH.lockUntil = Date.now() + 30000; loginErr("Terlalu banyak percobaan. Coba lagi dalam 30 detik."); }
    else loginErr("Username atau password salah.");
    $("lp").value = ""; $("lp").focus();
  }
}
$("lbtn").onclick = doLogin;
["lu", "lp"].forEach(function (id) {
  $(id).addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); doLogin(); } });
});

function logout() {
  if (!confirm("Keluar dari sistem?")) return;
  try { sessionStorage.removeItem(AUTH.sess); } catch (e) {}
  cart = []; pay = { diskon: 0, metode: "Tunai", uang: "" };
  closeModal();
  $("main").innerHTML = "";
  showLogin();
}

function formPass() {
  openModal('<h3>🔑 Ubah Username / Password</h3><div class="fg">' +
    '<div class="full"><label>Username</label><input id="a_user" value="' + esc(AUTH.get().user) + '" autocomplete="off"></div>' +
    '<div class="full"><label>Password Lama</label><input id="a_old" type="password" autocomplete="off"></div>' +
    '<div class="full"><label>Password Baru</label><input id="a_new" type="password" autocomplete="off" placeholder="Minimal 6 karakter"></div>' +
    '<div class="full"><label>Ulangi Password Baru</label><input id="a_new2" type="password" autocomplete="off"></div></div>' +
    '<div class="acts"><button class="btn sec" onclick="closeModal()">Batal</button><button class="btn" onclick="simpanPass()">Simpan</button></div>');
}
function simpanPass() {
  var a = AUTH.get(), u = $("a_user").value.trim(), o = $("a_old").value, n = $("a_new").value, n2 = $("a_new2").value;
  if (AUTH.hash(o) !== a.hash) return toast("Password lama salah", true);
  if (!u) return toast("Username wajib diisi", true);
  if (n.length < 6) return toast("Password baru minimal 6 karakter", true);
  if (n !== n2) return toast("Ulangi password tidak sama", true);
  AUTH.set({ user: u, hash: AUTH.hash(n) });
  try { sessionStorage.setItem(AUTH.sess, u); } catch (e) {}
  $("sbUser").textContent = u;
  closeModal(); toast("Akun berhasil diperbarui");
}

/* ================= START ================= */
function startApp() {
  $("sbNama").textContent = DB.d.settings.nama;
  $("sbUser").textContent = AUTH.get().user;
  go("dash");
}
DB.load();
$("sbNama").textContent = DB.d.settings.nama;
if (AUTH.isIn()) startApp(); else showLogin();
</script>
